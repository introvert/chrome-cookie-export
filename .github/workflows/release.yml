name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        if: github.ref_type == 'tag'
        run: |
          v=$(jq -r .version manifest.json)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != manifest version v$v"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run end-to-end tests
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          node tests/e2e.js

      - name: Build zip
        id: build
        run: echo "zip=$(tools/build-zip.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cookie-export
          path: ${{ steps.build.outputs.zip }}

      - name: Publish GitHub release
        # Tag push: release that tag. Manual run: create tag v<manifest version>
        # on the current commit (fails if that release already exists).
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"; target_args=(--verify-tag)
          else
            tag="v$(jq -r .version manifest.json)"; target_args=(--target "${GITHUB_SHA}")
          fi
          gh release create "$tag" "$ZIP" "${target_args[@]}" \
            --title "Cookie Export $tag" \
            --notes "Download \`$(basename "$ZIP")\`, unzip it, then in \`chrome://extensions\` enable Developer mode and click **Load unpacked** on the unzipped folder."
