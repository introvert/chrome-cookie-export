name: Release

# Runs the e2e test on every push to main and publishes a GitHub release
# (tag v<manifest version>) whenever that version has not been released yet.
# Pushing a v* tag or running the workflow manually also works.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version manifest.json)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != manifest version v$version"; exit 1; }
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; will only test and build."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run end-to-end tests
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          node tests/e2e.js

      - name: Build zip
        id: build
        run: echo "zip=$(tools/build-zip.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cookie-export
          path: ${{ steps.build.outputs.zip }}

      - name: Publish GitHub release
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          gh release create "$TAG" "$ZIP" --target "${GITHUB_SHA}" \
            --title "Cookie Export $TAG" \
            --notes "Download \`$(basename "$ZIP")\`, unzip it, then in \`chrome://extensions\` enable Developer mode and click **Load unpacked** on the unzipped folder."
