name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(jq -r .version manifest.json)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != manifest version v$v"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run end-to-end tests
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          node tests/e2e.js

      - name: Build zip
        id: build
        run: echo "zip=$(tools/build-zip.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cookie-export
          path: ${{ steps.build.outputs.zip }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.build.outputs.zip }}" \
            --title "Cookie Export ${GITHUB_REF_NAME}" \
            --notes "Download \`$(basename "${{ steps.build.outputs.zip }}")\`, unzip it, then in \`chrome://extensions\` enable Developer mode and click **Load unpacked** on the unzipped folder." \
            --verify-tag
