<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cookie Export</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Cookie Export</h1>
    <div id="site" class="site">Loading…</div>
  </header>

  <section class="controls">
    <label>
      Format
      <select id="format">
        <option value="json">JSON</option>
        <option value="netscape">Netscape (cookies.txt)</option>
        <option value="header">Cookie header</option>
      </select>
    </label>
    <label class="check">
      <input type="checkbox" id="wholeDomain">
      Include all paths and subdomains of this host
    </label>
  </section>

  <section class="picker">
    <div class="picker-bar">
      <label class="check all">
        <input type="checkbox" id="selectAll">
        <span id="count">0 cookies</span>
      </label>
      <input type="search" id="filter" placeholder="Filter by name, domain or value" aria-label="Filter cookies">
    </div>
    <ul id="list" class="list" aria-label="Cookies"></ul>
    <div id="empty" class="empty" hidden>No cookies for this site.</div>
  </section>

  <details id="previewBox">
    <summary>Preview</summary>
    <textarea id="output" wrap="off" readonly spellcheck="false" aria-label="Export preview"></textarea>
  </details>

  <div class="buttons">
    <button id="copy">Copy</button>
    <button id="download" class="primary">Download</button>
  </div>
  <div id="status" class="status" role="status"></div>

  <script src="popup.js"></script>
</body>
</html>
